# prediction horizon
horizon: 50
color: 'red'

# weights for the cost function
cost_weights:
  ex: 0.5
  ey: 0.5

# input constraints
input_constraints:
  v_min: -3
  v_max: 3
  w_min: -0.4
  w_max: 0.4

# state constraints
state_constraints:
  x_min: -10
  x_max: 10
  y_min: -10
  y_max: 10
  psi_min: -0.3
  psi_max: 0.3